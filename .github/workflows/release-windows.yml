name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'win-v*'

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: win-app/package-lock.json

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content win-app/package.json -Raw | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: win-app
        run: npm ci

      - name: Build NSIS installer
        working-directory: win-app
        run: npm run dist

      - name: Stage release asset with stable name
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $installer = Get-ChildItem 'win-app/dist/*Setup*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          Copy-Item -LiteralPath $installer.FullName -Destination "win-app/dist/TuS-Setup-$version.exe" -Force

      - name: Publish installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-v${{ steps.version.outputs.value }}
          name: 职场那些事 Windows v${{ steps.version.outputs.value }}
          body: |
            v${{ steps.version.outputs.value }}：小能仔完整造型、吐槽收藏与详情、全页搜索/资料/发布流程更新。
          files: win-app/dist/TuS-Setup-${{ steps.version.outputs.value }}.exe
