<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://43.157.17.88:8020 http://localhost:8020 http://localhost:3000 data: blob:; img-src 'self' http://43.157.17.88:8020 http://localhost:8020 http://localhost:3000 data: blob:; media-src 'self' http://43.157.17.88:8020 http://localhost:8020 data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://43.157.17.88:8020 ws://43.157.17.88:8020 http://localhost:8020 ws://localhost:8020 http://localhost:3000 ws://localhost:3000">
  <title>职场那些事</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 启动动画 -->
  <div id="splash" class="splash">
    <div class="splash-logo"><img src="../assets/ui/icons/ui_brand_tus.png" alt=""></div>
    <div class="splash-title">职场那些事</div>
    <div class="splash-sub">匿名树洞 · 放心吐槽你的职场日常</div>
    <div class="splash-bar"><div class="splash-bar-inner"></div></div>
  </div>

  <!-- 登录页 -->
  <div id="login-page" class="page center-page hidden">
    <div class="login-card">
      <div class="brand-icon"><img src="../assets/ui/icons/ui_brand_tus.png" alt=""></div>
      <h1 class="brand-title">职场那些事</h1>
      <p class="brand-subtitle">匿名树洞 · 放心吐槽你的职场日常</p>

      <div id="saved-accounts" class="saved-accounts hidden"></div>

      <div class="field">
        <input id="login-username" type="text" placeholder="用户名" autocomplete="off">
      </div>
      <div class="field">
        <input id="login-password" type="password" placeholder="密码（至少 6 位）">
      </div>
      <div id="register-field" class="field hidden">
        <input id="login-nickname" type="text" placeholder="昵称">
      </div>
      <div id="register-phone-field" class="field hidden">
        <input id="login-phone" type="tel" placeholder="手机号（选填，填写则需验证码）" maxlength="11" autocomplete="off">
      </div>
      <div id="register-code-field" class="field hidden">
        <div style="display:flex;gap:8px">
          <input id="login-code" type="text" placeholder="手机验证码" maxlength="6" style="flex:1" autocomplete="off">
          <button id="send-code-btn" class="btn btn-outline" style="white-space:nowrap">获取验证码</button>
        </div>
      </div>
      <div id="login-error" class="error-text hidden"></div>
      <button id="login-submit" class="btn btn-primary btn-block">登 录</button>
      <div class="login-links">
        <button id="login-toggle" class="btn-link">没有账号？注册一个</button>
        <button id="forgot-btn" class="btn-link">忘记密码？</button>
      </div>
      <p class="hint">服务地址：http://43.157.17.88:8020（体验账号 aqing / 123456）</p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app" class="hidden">
    <!-- 左侧导航栏 -->
    <aside class="sidebar">
      <div class="sidebar-brand"><img class="brand-icon-small" src="../assets/ui/icons/ui_brand_tus.png" alt=""> 职场那些事</div>
      <div class="sidebar-tagline">职场关系操作系统</div>
      <nav class="side-nav">
        <button class="tab active" data-view="home"><img class="tab-icon" src="../assets/ui/icons/ui_nav_home.png" alt=""><span>首页</span></button>
        <button class="tab" data-view="complaint"><img class="tab-icon" src="../assets/ui/icons/ui_nav_plaza.png" alt=""><span>吐槽广场</span></button>
        <button class="tab" data-view="colleague"><img class="tab-icon" src="../assets/ui/icons/ui_feature_colleagues.png" alt=""><span>同事</span></button>
        <button class="tab" data-view="ai"><img class="tab-icon" src="../assets/ui/icons/ui_message_ai.png" alt=""><span>AI 洞察</span></button>
        <button class="tab" data-view="company"><img class="tab-icon" src="../assets/ui/icons/ui_row_company.png" alt=""><span>公司</span></button>
        <button class="tab" data-view="mine"><img class="tab-icon" src="../assets/ui/icons/ui_nav_profile.png" alt=""><span>我的</span></button>
      </nav>
      <button class="sidebar-publish" id="sidebar-publish"><img src="../assets/ui/icons/ui_nav_publish.png" alt=""><span>快捷发布</span></button>
      <div class="sidebar-promo" id="sidebar-promo">
        <div class="promo-icon">🛒</div>
        <div class="promo-title">小程序市场</div>
        <div class="promo-sub">消息页进入 · 人人可发布</div>
        <button class="promo-btn" id="promo-btn">去看看</button>
      </div>
    </aside>

    <!-- 右侧：顶栏 + 内容区 -->
    <div class="main-col">
      <header class="topbar">
        <div class="topbar-title">职场那些事</div>
        <div class="topbar-right">
          <button class="bell-btn" id="msg-bell-btn" title="消息"><img class="bell-emoji" src="../assets/ui/icons/ui_nav_messages.png" alt=""><span id="msg-bell-badge" class="bell-badge hidden"></span></button>
          <button class="bell-btn" id="bell-btn" title="系统通知"><img src="../assets/ui/icons/ui_message_system.png" alt=""><span id="bell-dot" class="bell-dot hidden"></span></button>
          <div class="user-menu" id="user-menu">
            <span id="topbar-avatar" class="topbar-avatar"></span>
            <span id="topbar-user-name" class="topbar-username"></span>
            <span class="caret">▾</span>
            <div class="user-dropdown hidden" id="user-dropdown">
              <button class="dropdown-item" id="logout-btn">🚪 退出登录</button>
            </div>
          </div>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>

    <!-- 消息中心抽屉（v3：全部/AI提醒/互动/系统） -->
    <div id="msg-drawer-mask" class="modal-mask hidden">
      <div id="msg-drawer-box" class="msg-drawer">
        <div class="msg-drawer-head">
          <span class="msg-drawer-title">🔔 消息中心</span>
          <button data-close class="modal-close" title="关闭">✕</button>
        </div>
        <div class="msg-drawer-tabs" id="msg-tabs">
          <button class="active" data-tab="all">全部</button>
          <button data-tab="ai">🤖 AI提醒</button>
          <button data-tab="interaction">互动</button>
          <button data-tab="system">系统</button>
        </div>
        <div id="msg-drawer-body" class="msg-drawer-body"></div>
      </div>
    </div>
  </div>

  <!-- 全局弹窗 -->
  <div id="modal-mask" class="modal-mask hidden">
    <div id="modal-box" class="modal-box"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="../node_modules/socket.io-client/dist/socket.io.min.js"></script>
  <script src="ui-assets.js"></script>
  <script src="little-energy.js"></script>
  <script src="page-history.js"></script>
  <script src="api.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
</body>
</html>
